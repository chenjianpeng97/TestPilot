[project]
name = "tuner-testkit"
version = "7.2.0"
description = "TestPilot: shared test runtime, recorders, and DNA overlay for SUT test workspaces"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "tuner-testkit contributors"}]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
db = [
    "pymysql>=1.2.0",
    "pymssql>=2.3.0",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
]
api = [
    "requests>=2.33.1",
]
web-ui = [
    "playwright>=1.54.0",
]
# Reserved extra name for a future mobile stack (not implemented in 4.0).
phone-ui = []
excel = [
    "openpyxl>=3.1.0",
]
fake = [
    "faker>=37.0.0",
]
mock = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
]
workbench = [
    "tuner-testkit[mock]",
    "jinja2>=3.1.0",
]
recorder = [
    "playwright>=1.54.0",
    "mitmproxy>=11.1.3",
]
test = [
    "pytest>=9.0.3",
    "openpyxl>=3.1.0",
    "httpx>=0.28.0",
]
bdd = [
    "behave>=1.2.6",
    "playwright>=1.54.0",
    "behave-html-pretty-formatter>=1.16.1",
]
report = [
    "docxtpl>=0.19",
]
# Union of capability extras (excludes `dev` to avoid a cycle).
all = [
    "tuner-testkit[db,api,web-ui,phone-ui,excel,fake,mock,recorder,test,bdd,workbench,report]",
]
dev = [
    "tuner-testkit[all]",
]

[project.scripts]
tuner-config = "tuner_testkit.config:main"
tuner-recorder = "tuner_testkit.apps.recorder.cli:main"
tuner-page-recorder = "tuner_testkit.apps.page_recorder.cli:main"
tuner-api-recorder = "tuner_testkit.apps.api_recorder.cli:main"
tuner-dump-ddl = "tuner_testkit.apps.dump_ddl:main"
tuner-mock-server = "tuner_testkit.apps.mock_server.cli:main"
tuner-dna = "tuner_testkit.apps.dna.cli:main"
tuner-init = "tuner_testkit.apps.init_repo.__main__:main"
tuner-index-ai = "tuner_testkit.apps.index_ai.__main__:main"
tuner-workspace = "tuner_testkit.workspace.cli:main"
tuner-fake = "tuner_testkit.fake.cli:main"
tuner-page-test = "tuner_testkit.page_test.__main__:main"
tuner-action-words = "tuner_testkit.action_words.__main__:main"
tuner-evidence = "tuner_testkit.apps.evidence.cli:main"
tuner-task = "tuner_testkit.apps.task.cli:main"
tuner-testreport = "tuner_testkit.apps.testreport.cli:main"
tuner-dashboard = "tuner_testkit.apps.dashboard.cli:main"
tuner-openapi-import = "tuner_testkit.apps.openapi_import.cli:main"
tuner-workbench = "tuner_testkit.workbench.cli:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tuner_testkit*"]

[tool.setuptools.package-data]
"tuner_testkit.apps.dna" = ["dna_payload/**/*"]
"tuner_testkit.apps.init_repo" = ["stubs/**/*"]
"tuner_testkit.workbench" = ["templates/**/*", "static/**/*"]
"tuner_testkit.apps.testreport" = ["templates/*.docx"]

[tool.setuptools.cmdclass]
build_py = "tuner_testkit.apps.dna.build.BuildPyWithDna"
sdist = "tuner_testkit.apps.dna.build.SdistWithDna"

[tool.tuner-testkit]
page_objects = "packages/page_objects"
api_objects = "packages/api_objects"
mocks = "data/mocks"

[tool.ruff]
# CI runs the same release: `uvx ruff@0.17.3 check .`
required-version = ">=0.17.3,<0.18"
target-version = "py312"
extend-exclude = ["tuner_testkit/apps/dna/dna_payload", "build", "dist"]

[tool.ruff.lint]
# Correctness, not style: syntax / import placement / statement errors (E4, E7, E9),
# pyflakes (F), bugbear (B), and blind except (BLE). A broad `except Exception`
# must say why: `# noqa: BLE001 -- <reason>`.
select = ["E4", "E7", "E9", "F", "B", "BLE"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["packages/tests", "tuner_testkit"]
